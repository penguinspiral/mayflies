name: OCI build & publish

on:
  pull_request:
    branches:
      - main
    paths:
      - oci/Containerfile
      - oci/Makefile
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed

permissions: {}

jobs:
  oci-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oci

    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build Containerfile (buildah)
        run: make build OCI_BINARY=buildah

      - name: Build Containerfile (docker)
        run: make build OCI_BINARY=docker

        # Automatically logout upon workflow completion via action's "Post job"
      - name: Log in to DockerHub (docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ vars.DOCKER_REGISTRY }}

      - name: Log in to DockerHub (podman/buildah/skopeo)
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ vars.DOCKER_REGISTRY }}

      - name: Publish Containerfile (buildah)
        if: github.event.pull_request.merged == true
        run: make push OCI_BINARY=buildah

      # Repository image immutable tag means only one OCI binary can push
      # Capturing Docker implementation for posterity
